<!doctype html>
<!-- The shape of a real Ashby application page: no <form> element, a resume-autofill panel that carries the
     same "application-form" class as the questions and comes first, and the questions split over sibling
     containers. The first element matching the class holds one input; no single one holds most of the page. -->
<html lang="en">
  <head><meta charset="utf-8" /><title>Research Internship</title></head>
  <body>
    <div id="root">
      <div class="ashby-application-form-autofill-pane">
        <p>Autofill from resume</p>
        <input type="file" id="autofill" aria-label="Autofill from resume" />
      </div>
      <div class="ashby-application-form-container">
        <div class="ashby-application-form-section">
          <label for="name">Name<span>*</span></label>
          <input id="name" name="_systemfield_name" type="text" required />
          <label for="email">Email<span>*</span></label>
          <input id="email" name="_systemfield_email" type="email" required />
          <label for="phone">Phone</label>
          <input id="phone" name="phone" type="tel" />
        </div>
        <div class="ashby-application-form-section">
          <label for="company">Current company</label>
          <input id="company" name="company" type="text" />
          <label for="loc">Current location<span>*</span></label>
          <input id="loc" name="location" type="text" required />
          <label for="linkedin">LinkedIn</label>
          <input id="linkedin" name="linkedin" type="text" />
        </div>
        <!-- Ashby's Yes / No: two buttons and a hidden checkbox holding the answer. -->
        <div class="_fieldEntry_x ashby-application-form-field-entry">
          <label class="_required_x ashby-application-form-question-title" for="sponsor">Will you require sponsorship to work from your country of residence?</label>
          <div class="_yesno_x ashby-application-form-input-yesno">
            <button type="button" aria-pressed="false" data-option="yes" onclick="this.setAttribute('aria-pressed','true');this.nextElementSibling.setAttribute('aria-pressed','false')">Yes</button>
            <button type="button" aria-pressed="false" data-option="no" onclick="this.setAttribute('aria-pressed','true');this.previousElementSibling.setAttribute('aria-pressed','false')">No</button>
            <input type="checkbox" tabindex="-1" name="sponsor" style="position:absolute;opacity:0;width:1px;height:1px" />
          </div>
        </div>
        <!-- "Select all that apply" where each box has its own name. -->
        <div class="_fieldEntry_y ashby-application-form-field-entry">
          <label class="ashby-application-form-question-title">Which languages do you speak? Select all that apply.</label>
          <label><input type="checkbox" name="lang_en" /> English</label>
          <label><input type="checkbox" name="lang_fr" /> French</label>
          <label><input type="checkbox" name="lang_es" /> Spanish</label>
        </div>
        <button type="button">Submit Application</button>
      </div>
    </div>
  </body>
</html>
