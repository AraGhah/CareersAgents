<!doctype html>
<!-- Fixture: the application form a signed-in candidate reaches. Not an account page. -->
<html lang="en">
  <head><meta charset="utf-8" /><title>Application</title></head>
  <body>
    <main>
      <h1>Software Developer Intern</h1>
      <form id="application-form">
        <label for="first">First name *</label><input id="first" name="first" required />
        <label for="last">Last name *</label><input id="last" name="last" required />
        <label for="mail">Email *</label><input id="mail" name="mail" type="email" required />
        <label for="cv">Resume *</label><input id="cv" name="cv" type="file" required />
      </form>
    </main>
  </body>
</html>
