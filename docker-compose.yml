services:
  db:
    image: postgres:17
    container_name: internship-desk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: internship
      POSTGRES_PASSWORD: internship
      POSTGRES_DB: internship_desk
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U internship -d internship_desk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
